networks:
  starbug_network:
    driver: bridge

services:
  holly:
    build:
      context: ./holly
      dockerfile: Dockerfile
    environment:
      - HOLLY_PORT=${HOLLY_PORT:-3000}
      # Use NGINX_TEMPLATE_TYPE setup for initial setup of Let's Encrypt
      - NGINX_TEMPLATE_TYPE=production
    expose:
      - "${HOLLY_PORT:-3000}"
    networks:
      - starbug_network
    platform: linux/amd64
  holly-test:
    build:
      context: ./holly
      dockerfile: Dockerfile.dev
    command: sh -c "npx vitest --run && touch /tmp/tests-passed || exit 1"
    networks:
      - starbug_network
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tests-passed"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 10s
  navigator:
    build: ./navigator
    command: gunicorn --bind 0.0.0.0:5000 www:app
    expose:
      - 5000
    networks:
      - starbug_network
    platform: linux/amd64
  nginx:
    build: ./nginx
    depends_on:
      holly:
        condition: service_started
      holly-test:
        condition: service_completed_successfully
      navigator:
        condition: service_started
    environment:
      - HOLLY_PORT=${HOLLY_PORT:-3000}
    networks:
      - starbug_network
    platform: linux/amd64
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    secrets:
      - nginx_dhparam

  certbot:
    image: certbot/certbot
    container_name: certbot_ssl
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    # Keeps the container alive checking for renewals every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

secrets:
  nginx_dhparam:
    file: ./nginx/certs/dhparam.pem
