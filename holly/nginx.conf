server {
    listen 3000;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
